<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Testimonios — Panel SOMAR</title>
<link rel="icon" type="image/svg+xml" href="/assets/favicon.svg">
<link rel="icon" type="image/png" href="/assets/somar-logo-oval.png">
<link rel="apple-touch-icon" href="/assets/somar-logo-oval.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700;900&family=Roboto+Condensed:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/admin/css/admin.css?v=2">
</head>
<body data-nav="testimonios">
  <div class="app" id="app">
    <div class="backdrop" id="backdrop"></div>
    <aside class="sidebar"></aside>
    <div class="main">
      <header class="topbar">
        <div style="display:flex;align-items:center;gap:12px">
          <button class="burger" id="burger" aria-label="Menú">☰</button>
          <div class="title">Testimonios</div>
        </div>
        <div class="who"><span id="whoName" class="muted">Cargando…</span><span class="av" id="whoAvatar">S</span></div>
      </header>
      <div class="content"><div id="crudRoot"></div></div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="/js/config.js"></script>
  <script src="/admin/js/auth.js"></script>
  <script src="/admin/js/nav.js"></script>
  <script src="/admin/js/storage.js"></script>
  <script src="/admin/js/crud.js"></script>
  <script>
    SOMAR_CRUD.page({
      table: 'testimonials',
      singular: 'testimonio',
      search: 'customer_name',
      columns: [
        { field: 'customer_name', label: 'Cliente', type: 'primary' },
        { field: 'rating', label: 'Puntaje', type: 'rating', width: '120px' },
        { field: 'review', label: 'Reseña', type: 'text' },
        { field: 'display_order', label: 'Orden', type: 'order', width: '70px' }
      ],
      fields: [
        { name: 'customer_name', label: 'Nombre del cliente', type: 'text', required: true },
        { name: 'rating', label: 'Puntaje (1 a 5)', type: 'number', min: 1, max: 5, default: 5 },
        { name: 'review', label: 'Reseña', type: 'textarea', required: true, rows: 4, col: 2 },
        { name: 'avatar_url', label: 'Foto / avatar (opcional)', type: 'image' },
        { name: 'display_order', label: 'Orden', type: 'number', default: 0 },
        { name: 'is_active', label: 'Activo (visible en la web)', type: 'checkbox', default: true }
      ]
    });
  </script>
</body>
</html>
