<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Contenido — Panel SOMAR</title>
<link rel="icon" type="image/svg+xml" href="/assets/favicon.svg">
<link rel="icon" type="image/png" href="/assets/somar-logo-oval.png">
<link rel="apple-touch-icon" href="/assets/somar-logo-oval.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700;900&family=Roboto+Condensed:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/admin/css/admin.css?v=3">
</head>
<body data-nav="contenido">
  <div class="app" id="app">
    <div class="backdrop" id="backdrop"></div>
    <aside class="sidebar"></aside>
    <div class="main">
      <header class="topbar">
        <div style="display:flex;align-items:center;gap:12px">
          <button class="burger" id="burger" aria-label="Menú">☰</button>
          <div class="title">Contenido de la web</div>
        </div>
        <div class="who"><span id="whoName" class="muted">Cargando…</span><span class="av" id="whoAvatar">S</span></div>
      </header>
      <div class="content"><div id="crudRoot"></div></div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="/js/config.js"></script>
  <script src="/admin/js/auth.js"></script>
  <script src="/admin/js/nav.js"></script>
  <script src="/admin/js/crud.js"></script>
  <script>
    SOMAR_CRUD.tabs('#crudRoot', [
      {
        label: 'Banners',
        config: {
          table: 'banners',
          singular: 'banner',
          search: 'title',
          // Oculta de la lista los banners que la web pública no muestra (quedan en la base).
          hideWhere: function (r) { return ['offers', 'final_cta', 'about'].indexOf(r.type) !== -1; },
          columns: [
            { field: 'title', label: 'Banner', type: 'primary', sub: 'type' },
            { field: 'image_url', label: 'Imagen', type: 'thumb', width: '60px' },
            { field: 'display_order', label: 'Orden', type: 'order', width: '70px' }
          ],
          fields: [
            { name: 'type', label: 'Ubicación / tipo', type: 'select', optional: false, required: true, default: 'hero',
              options: [
                { value: 'hero', label: 'Hero (portada principal)' },
                { value: 'featured_promotion', label: 'Promoción destacada' }
              ] },
            { name: 'eyebrow', label: 'Etiqueta superior (eyebrow)', type: 'text', hint: 'Se muestra solo en "Promoción destacada".' },
            { name: 'title', label: 'Título', type: 'text', col: 2 },
            { name: 'subtitle', label: 'Subtítulo', type: 'textarea', col: 2 },
            { name: 'image_url', label: 'Imagen', type: 'image', hint: 'Hero: imagen derecha de la portada. Promoción destacada: imagen del bloque.' },
            { name: 'cta_label', label: 'Texto del botón', type: 'text', placeholder: 'Ver productos' },
            { name: 'text_color', label: 'Color del título', type: 'color', hint: 'Color de las letras del título (para campañas). Dejalo vacío para usar el color normal del diseño.' },
            { name: 'theme', label: 'Puntos del Hero (separá con | )', type: 'text', col: 2, hint: 'Ej: Calidad garantizada | Atención cercana | Entregas coordinadas. Solo se usa en el Hero.' },
            { name: 'display_order', label: 'Orden', type: 'number', default: 0 },
            { name: 'is_active', label: 'Activo (visible en la web)', type: 'checkbox', default: true }
          ]
        }
      },
      {
        label: 'Beneficios',
        config: {
          table: 'benefits',
          singular: 'beneficio',
          columns: [
            { field: 'title', label: 'Beneficio', type: 'primary' },
            { field: 'display_order', label: 'Orden', type: 'order', width: '70px' }
          ],
          fields: [
            { name: 'title', label: 'Título', type: 'text', required: true, col: 2 },
            { name: 'display_order', label: 'Orden', type: 'number', default: 0 },
            { name: 'is_active', label: 'Activo (visible en la web)', type: 'checkbox', default: true }
          ]
        }
      },
      {
        label: 'Pasos de compra',
        config: {
          table: 'purchase_steps',
          singular: 'paso',
          columns: [
            { field: 'step_number', label: 'N°', type: 'text', width: '60px' },
            { field: 'title', label: 'Paso', type: 'primary' },
            { field: 'accent_color', label: 'Color', type: 'color' },
            { field: 'display_order', label: 'Orden', type: 'order', width: '70px' }
          ],
          fields: [
            { name: 'step_number', label: 'Número de paso', type: 'number', required: true, min: 1, default: 1 },
            { name: 'title', label: 'Título', type: 'text', required: true, col: 2 },
            { name: 'description', label: 'Descripción', type: 'textarea', col: 2 },
            { name: 'accent_color', label: 'Color de acento', type: 'color' },
            { name: 'display_order', label: 'Orden', type: 'number', default: 0 },
            { name: 'is_active', label: 'Activo (visible en la web)', type: 'checkbox', default: true }
          ]
        }
      }
      // "Estadísticas" oculto: el bloque de stats de la web está display:none (no se muestra).
    ]);
  </script>
</body>
</html>
